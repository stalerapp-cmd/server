<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>S-Taler call server</title>
<style>
  :root { color-scheme: light dark; --bg:#f4f5fb; --ink:#141a3a; --muted:#5b6283; --ok:#3d6b2f; --card:#fff; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0e1122; --ink:#eef0fa; --muted:#a3a9c6; --ok:#9de07b; --card:#171b33; } }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--ink); font:16px/1.6 system-ui, "Segoe UI", Tahoma, sans-serif; padding:16px; }
  main { background:var(--card); border-radius:24px; padding:28px; max-width:440px; box-shadow:0 10px 40px rgba(20,26,58,.12); }
  h1 { margin:0 0 6px; font-size:22px; }
  p { margin:0 0 10px; color:var(--muted); }
  .ok { display:inline-flex; gap:8px; align-items:center; color:var(--ok); font-weight:600; }
  .dot { width:10px; height:10px; border-radius:50%; background:currentColor; }
  code { font-size:13px; }
</style>
</head>
<body>
<main>
  <h1>سيرفر مكالمات S‑Taler</h1>
  <p>بيعطي تطبيق S‑Taler مفاتيح مؤقتة لسيرفر وسيط (TURN)، عشان مكالمات الدعم توصل حتى على الشبكات اللي بتسكّر الطريق المباشر بين الجهازين.</p>
  <p class="ok" id="st"><span class="dot"></span> <span id="stt">بفحص…</span></p>
  <p><code>/api/health</code> · <code>/api/ice</code> (بس لسيرفر S‑Taler)</p>
</main>
<script>
  fetch('/api/health').then(r => r.json()).then(j => { document.getElementById('stt').textContent = j.status === 'ok' ? 'شغّال' : 'في مشكلة'; })
    .catch(() => { document.getElementById('stt').textContent = 'ما رد'; document.getElementById('st').style.color = '#b33'; });
</script>
</body>
</html>
